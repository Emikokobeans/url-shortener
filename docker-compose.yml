services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urlshortener-backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - APP_BASE_URL=http://localhost:8080

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: urlshortener-frontend
    depends_on:
      - backend
    ports:
      - "8082:80"
